<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; padding: 14px; color: #1d2226; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { margin: 0 0 10px; line-height: 1.45; color: #56687a; }
    button { width: 100%; padding: 8px; border: none; border-radius: 18px; background: #0a66c2; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #08538f; }
    .status { margin-top: 10px; font-size: 12px; color: #1a7f37; }
  </style>
</head>
<body>
  <h1>LinkedIn Network Helper</h1>
  <p>Each tool's control panel appears on its page — scan, select, and process from there.</p>
  <button id="go">Open Sent Invitations</button>
  <button id="goCatchup" style="margin-top:8px;background:#1a7f37;">Open Catch-up</button>
  <button id="goConnections" style="margin-top:8px;background:#6e4bb6;">Open Connections (Export)</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
